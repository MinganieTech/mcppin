name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags: a tag can be moved, and
# an action runs with the same rights as the workflow. Dependabot keeps them
# current, because a pin nobody updates is a pin that rots.
jobs:
  test:
    # The output is ASCII and the lockfile is written through a rename because
    # of Windows, so Windows is not an afterthought in this matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      # There is one dependency and it is pinned. Both facts are worth checking
      # on every push rather than at the next release.
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  # The exporter reads a server's pipes while forwarding its standard error, so
  # there is concurrency to get wrong. -race needs a C toolchain, which is why
  # it is one job rather than a column in the matrix above.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -race ./...

  # A tool that tells people what to trust should know when what it is built
  # from stops being trustworthy.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Short runs on every push. They are not looking for a crash so much as for
  # an input this build reads differently from the way it writes.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -run=Fuzz -fuzz=FuzzDecodeAndCanonicalize -fuzztime=60s ./internal/mcppin/
      - run: go test -run=Fuzz -fuzz=FuzzReadManifest -fuzztime=60s ./internal/mcppin/
