name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # For the provenance attestation: a signed statement, in a public
  # transparency log, that these exact bytes were built by this workflow from
  # this commit. Checksums say the download is not corrupt; they say nothing
  # about where it came from.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The version lives in cli.go and nowhere else. A tag that disagrees with
      # it would publish a binary that misreports itself.
      - name: the tag has to match the version in the source
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "Version = \"${version}\"" internal/mcppin/cli.go; then
            echo "tag ${GITHUB_REF_NAME} does not match the Version constant"
            grep 'Version = ' internal/mcppin/cli.go
            exit 1
          fi

      # A release comes from a commit that passed everything, not from one that
      # merely compiles here. The tests below are a second opinion; this step
      # is the one that refuses to publish a commit whose fuzzing, race
      # detector or vulnerability scan never ran or did not pass.
      - name: the tagged commit has to have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --paginate \
                   --jq '.check_runs[] | "\(.name)=\(.conclusion)"')
          echo "${runs}"
          missing=0
          for check in "test (ubuntu-latest)" "test (windows-latest)" "test (macos-latest)" \
                       race vulnerabilities fuzz; do
            if ! printf '%s\n' "${runs}" | grep -qxF "${check}=success"; then
              echo "::error::${check} did not pass on ${GITHUB_SHA}"
              missing=1
            fi
          done
          exit ${missing}

      - run: go vet ./...
      - run: go test ./...

      - name: build every target
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="mcppin_${GITHUB_REF_NAME}_${os}_${arch}"
            mkdir -p "dist/${name}"
            for binary in mcppin mcppin-export; do
              file="${binary}"
              if [ "${os}" = "windows" ]; then
                file="${binary}.exe"
              fi
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
                go build -trimpath -ldflags "-s -w" -o "dist/${name}/${file}" "./cmd/${binary}"
            done
            cp README.md LICENSE docs/threat-model.md "dist/${name}/"
            if [ "${os}" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            fi
            rm -rf "dist/${name}"
          done

      # A download nobody can check is a download nobody should run.
      - name: checksums
        run: cd dist && sha256sum * | tee SHA256SUMS

      # And a checksum published beside the file it covers, by the same job
      # that made both, only proves the download is not corrupt. The
      # attestation is a signed statement in a public transparency log that
      # these bytes came from this workflow, at this commit - which is the
      # question somebody downloading a security tool is actually asking.
      - name: attest where these bytes came from
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "See the README and the threat model for what a matching lockfile does and does not prove." \
            dist/*
